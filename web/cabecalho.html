<!DOCTYPE html>
<html>
    <head>
        <title>Cabeçalho</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS/Cabecalho.css">
    </head>
    <body>
        <section>
            <!-- menu -->
            <a href="Departamentos" target="produtos" class="dep" aria-label="Departamentos">
                <svg viewBox="0 0 17 12" aria-hidden="true">
                    <path d="M0.8 1h15.4M0.8 6h15.4M0.8 11h15.4"/>
                </svg>
            </a>

            <!-- logo -->
            <img src="CSS/titulo.png" alt="Fountaine" class="titulo">

            <!-- login (no lugar do coração) -->
            <a href="Login.html" target="produtos" class="login" aria-label="Entrar">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
                </svg>
            </a>

            <!-- sacola -->
            <a href="Carrinho" target="produtos" class="car" aria-label="Sacola">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5.5 8h13l1 12.5h-15z"/>
                    <path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>
                </svg>
            </a>
        </section>
    </body>
</html>
